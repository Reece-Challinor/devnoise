<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">DevNoise waveform mark</title>
  <defs>
    <linearGradient id="surface" x1="170" y1="120" x2="860" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21262d" />
      <stop offset="1" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="signal" x1="300" y1="250" x2="720" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56d364" />
      <stop offset="1" stop-color="#2ea043" />
    </linearGradient>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="220" fill="url(#surface)" />
  <rect x="73" y="73" width="878" height="878" rx="219" fill="none" stroke="#30363d" stroke-width="2" />
  <g fill="url(#signal)">
    <rect x="252" y="436" width="72" height="152" rx="36" />
    <rect x="364" y="328" width="72" height="368" rx="36" />
    <rect x="476" y="224" width="72" height="576" rx="36" />
    <rect x="588" y="350" width="72" height="324" rx="36" />
    <rect x="700" y="424" width="72" height="176" rx="36" />
  </g>
</svg>
