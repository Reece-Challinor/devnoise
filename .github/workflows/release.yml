name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string
      status_only:
        description: Check Apple's notarization history without submitting a new build
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 240
    env:
      DEVNOISE_SIGN_IDENTITY: ${{ secrets.DEVNOISE_SIGN_IDENTITY }}
      DEVNOISE_CERTIFICATE_P12_BASE64: ${{ secrets.DEVNOISE_CERTIFICATE_P12_BASE64 }}
      DEVNOISE_CERTIFICATE_P12_PASSWORD: ${{ secrets.DEVNOISE_CERTIFICATE_P12_PASSWORD }}
      DEVNOISE_NOTARY_KEY_P8_BASE64: ${{ secrets.DEVNOISE_NOTARY_KEY_P8_BASE64 }}
      DEVNOISE_NOTARY_KEY_ID: ${{ secrets.DEVNOISE_NOTARY_KEY_ID }}
      DEVNOISE_NOTARY_ISSUER_ID: ${{ secrets.DEVNOISE_NOTARY_ISSUER_ID }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      STATUS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.status_only || false }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate tag and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" == v* ]] || { echo "Tag must start with v." >&2; exit 1; }
          git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null

          required=(
            DEVNOISE_SIGN_IDENTITY
            DEVNOISE_CERTIFICATE_P12_BASE64
            DEVNOISE_CERTIFICATE_P12_PASSWORD
            DEVNOISE_NOTARY_KEY_P8_BASE64
            DEVNOISE_NOTARY_KEY_ID
            DEVNOISE_NOTARY_ISSUER_ID
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub secret: ${name}" >&2; exit 1; }
          done

      - name: Run tests
        run: make test

      - name: Configure signing and notarization
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/devnoise-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/devnoise-signing.p12"
          notary_key_path="${RUNNER_TEMP}/AuthKey_${DEVNOISE_NOTARY_KEY_ID}.p8"
          keychain_password="$(uuidgen)$(uuidgen)"
          echo "::add-mask::${keychain_password}"

          printf '%s' "${DEVNOISE_CERTIFICATE_P12_BASE64}" | base64 -D > "${certificate_path}"
          printf '%s' "${DEVNOISE_NOTARY_KEY_P8_BASE64}" | base64 -D > "${notary_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${DEVNOISE_CERTIFICATE_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          xcrun notarytool store-credentials "AC_NOTARY" \
            --key "${notary_key_path}" \
            --key-id "${DEVNOISE_NOTARY_KEY_ID}" \
            --issuer "${DEVNOISE_NOTARY_ISSUER_ID}" \
            --keychain "${keychain_path}"

          {
            echo "DEVNOISE_NOTARY_KEYCHAIN=${keychain_path}"
            echo "DEVNOISE_NOTARY_KEYCHAIN_PROFILE=AC_NOTARY"
          } >> "${GITHUB_ENV}"

      - name: Check Apple notarization history
        if: env.STATUS_ONLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --keychain-profile "${DEVNOISE_NOTARY_KEYCHAIN_PROFILE}" \
            --keychain "${DEVNOISE_NOTARY_KEYCHAIN}" \
            --output-format json

      - name: Build release app
        if: env.STATUS_ONLY != 'true'
        run: make app

      - name: Validate version
        if: env.STATUS_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/DevNoise.app/Contents/Info.plist)"
          [[ "v${version}" == "${RELEASE_TAG}" ]] || {
            echo "Tag ${RELEASE_TAG} does not match app version v${version}." >&2
            exit 1
          }

      - name: Sign app and DMG
        if: env.STATUS_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          scripts/codesign.sh dist/DevNoise.app
          scripts/dmg_build.sh dist/DevNoise.app

      - name: Notarize, staple, and verify
        if: env.STATUS_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          scripts/notarize.sh dist/DevNoise.dmg
          scripts/staple.sh dist/DevNoise.app dist/DevNoise.dmg
          scripts/sha256.sh dist/DevNoise.dmg
          scripts/verify_gatekeeper.sh dist/DevNoise.app dist/DevNoise.dmg

      - name: Attest DMG provenance
        if: env.STATUS_ONLY != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/DevNoise.dmg

      - name: Upload workflow artifacts
        if: env.STATUS_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: devnoise-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            dist/DevNoise.dmg
            dist/DevNoise.dmg.sha256

      - name: Publish GitHub release
        if: env.STATUS_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/DevNoise.dmg dist/DevNoise.dmg.sha256 --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/DevNoise.dmg \
              dist/DevNoise.dmg.sha256 \
              --draft \
              --generate-notes \
              --title "DevNoise ${RELEASE_TAG#v}" \
              --verify-tag
          fi
          gh release edit "${RELEASE_TAG}" --draft=false --latest

      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          keychain_path="${RUNNER_TEMP}/devnoise-signing.keychain-db"
          security delete-keychain "${keychain_path}" 2>/dev/null || true
