name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DevNoise
        run: xcodebuild -project DevNoise.xcodeproj -scheme DevNoise -configuration Debug build
