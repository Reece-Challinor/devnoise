name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Debug
        run: xcodebuild -project DevNoise.xcodeproj -scheme DevNoise -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

      - name: Build Release
        run: xcodebuild -project DevNoise.xcodeproj -scheme DevNoise -configuration Release CODE_SIGNING_ALLOWED=NO build
